<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Todo List</title>
    </head>
    <body>
        <header>
            <div id="page-title">Projects</div>
            <button id="btn-add" class="icon" type="button">Add</button>
            <button class="text" type="button">View Projects</button>
        </header>
        <div id="content">

        </div>
        <dialog id="dialog-add-todo">
            <form id="form-add-todo" action="dialog">
                <button id='btn-close' type="button">Close</button>
                <div class="form-column">
                    <label for="txt-title">
                        <div>Title</div>
                        <input id="txt-title" name="txtTitle" type="text" required>
                    </label>
                    <label for="sel-priority">
                        <div>Priority</div>
                        <select id="sel-priority" name="selPriority">
                            <option value=0>Low</option>
                            <option value="1">Medium</option>
                            <option value="2">High</option>
                        </select>
                    </label>
                    <label for="dt-due-date">
                        <div>Due Date</div>
                        <input id="dt-due-date" name="dtDueDate" type="date">
                    </label>
                </div>
                <div class="form-column">
                    <label for="txt-description">
                        <div>Description</div>
                        <input id="txt-description" name="txtDescription" type="text" required>
                    </label>
                </div>
                <button id="btn-save" type="submit">Save</button>
            </form>
        </dialog>
    </body>
</html>
